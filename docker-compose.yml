services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
