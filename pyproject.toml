[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Ritik Dhote",email = "ritikdhote0b@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain (>=1.4.6,<2.0.0)",
    "langchain-openai (>=1.7.2,<2.0.0)",
    "fastapi (>=0.143.3,<0.144.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pydantic[email] (>=2.14.1,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "black (>=25.1.0,<27.0.0)",
    "flake8 (>=7.1.2,<8.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
